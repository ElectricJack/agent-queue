[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.38.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-queue"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    # 2.6+ imports the Python 3.14-only `annotationlib` stdlib module
    # (via discord.ext.commands.flags) which breaks on 3.12/3.13. Pin to
    # the last 2.5.x until we raise requires-python to >=3.14.
    "discord.py>=2.5.2,<2.6",
    "PyYAML>=6.0",
    # Used by src/config_editor for round-trip YAML editing that preserves
    # comments, key order, and quoting style. Read path still uses PyYAML.
    "ruamel.yaml>=0.18",
    "fastapi>=0.135.0",
    "pydantic>=2.0",
    # Pin starlette to >=1.3.1 to address multiple 2026 CVEs (PYSEC-2026-161,
    # 248, 249, 2280, 2281) — request-parsing DoS and boundary-parsing issues.
    "starlette>=1.3.1",
    "structlog>=25.1.0",
    "rich>=13.9",
    "pygments>=2.20.0",
    # Pin zipp to >=3.19.1 to address CVE-2024-5569 (DoS via infinite loop
    # when processing crafted zip files in zipp.Path operations). Older
    # zipp comes in as a transitive dep of importlib-metadata.
    "zipp>=3.19.1",
    # Pin cryptography to >=50.0.0 to address CVE-2026-39892 (buffer overflow
    # in Hash.update on non-contiguous buffers) plus PYSEC-2026-3552/3553/3554
    # and GHSA-537c-gmf6-5ccf. Comes in transitively via google-auth
    # (inbox extras).
    "cryptography>=50.0.0",
    # Pin python-multipart to >=0.0.31 to address CVE-2026-40347 (multipart
    # preamble/epilogue DoS) and PYSEC-2026-3036/3037/3039/3040. Comes in as a
    # transitive dep of fastapi/starlette for form parsing.
    "python-multipart>=0.0.31",
    # Pin oauthlib to >=3.2.1 to address PYSEC-2022-269 / CVE-2022-36087
    # (DoS via malicious redirect URIs in OAuth2 provider support and
    # uri_validate). oauthlib comes in transitively via
    # google-auth-oauthlib / requests-oauthlib (inbox extras).
    "oauthlib>=3.2.1",
    # Pin aiohttp to >=3.14.3 to address 14 CVEs disclosed in 2026 (PYSEC-2026-
    # 237, 2104..2113, 3545..3547) — request-smuggling, header-parsing DoS, and
    # WebSocket framing bugs. Comes in transitively via discord.py and
    # google-api-python-client (inbox extras).
    "aiohttp>=3.14.3",
    # Pin setuptools to >=83.0.0 to address PYSEC-2025-49 / CVE-2025-47273
    # (PackageIndex path traversal / RCE) and PYSEC-2026-3447. Comes in as a
    # transitive dep through several optional extras.
    "setuptools>=83.0.0",
    # --- Additional 2026 CVE remediation pins (all transitive) ---
    # Pillow — 20 CVEs (PYSEC-2026-2253..2257, 3451..3454, 3493..3496).
    # Comes in via mkdocs-material (docs) and other transitive paths.
    "pillow>=12.3.0",
    # PyJWT — 8 CVEs (PYSEC-2026-175..179). Comes in via google-auth /
    # cryptography-adjacent tooling in inbox extras.
    "pyjwt>=2.13.0",
    # pyasn1 — 4 CVEs (PYSEC-2026-3455..3457) via google-auth (inbox).
    "pyasn1>=0.6.4",
    # urllib3 — PYSEC-2026-141, 142. Transitive via requests / google-*.
    "urllib3>=2.7.0",
    # idna — PYSEC-2026-215. Transitive via requests / aiohttp.
    "idna>=3.15",
    # httplib2 — PYSEC-2026-3444. Transitive via google-auth-httplib2.
    "httplib2>=0.32.0",
    # pyOpenSSL — PYSEC-2026-2268, 2269. Transitive via cryptography stack.
    "pyopenssl>=26.0.0",
    # soupsieve — PYSEC-2026-3071, 3072. Transitive via beautifulsoup4.
    "soupsieve>=2.8.4",
    # configobj — PYSEC-2026-1270. Transitive.
    "configobj>=5.0.9",
    # Mako — PYSEC-2026-2617. Transitive via alembic.
    "mako>=1.3.12",
    # msgpack — PYSEC-2026-3625. Transitive.
    "msgpack>=1.2.1",
    # pydantic-settings — GHSA-4xgf-cpjx-pc3j. Transitive via fastapi tooling.
    "pydantic-settings>=2.14.2",
    # Twisted — PYSEC-2024-75, PYSEC-2026-160, PYSEC-2026-1992. Transitive.
    "twisted>=26.4.0",
    # Click — PYSEC-2026-2132. Also pinned in [cli] extras; hoisted here so
    # transitive pulls (mkdocs, uvicorn, etc.) resolve to a safe version.
    "click>=8.3.3",
    # mcp — PYSEC-2026-3481, 3482, 3483. Also pinned in [mcp] extras; hoisted
    # here so transitive pulls (claude-agent-sdk, etc.) resolve to a safe
    # version. <2 because the FastMCP import moved in mcp 2.x.
    "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.42.0",
]
google = [
    "google-genai>=1.0.0",
]
inbox = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
]
postgresql = [
    "asyncpg>=0.29.0",
]
openai = [
    "openai>=1.0.0",
]
llm = [
    "anthropic>=0.42.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
]
mcp = [
    # 1.28.1 addresses PYSEC-2026-3481, 3482, 3483; <2 because FastMCP import moved in 2.x.
    "mcp>=1.28.1,<2",
]
cli = [
    # 8.3.3 addresses PYSEC-2026-2132.
    "click>=8.3.3",
    "prompt-toolkit>=3.0",
    "agent-queue-api-client @ file:packages/aq-client",
]
dev = [
    # ToolIndex's fake-memsearch positive-control exercises cosine similarity
    # directly, so CI needs NumPy even though memsearch itself is optional.
    "numpy>=2.0",
    # CVE-2025-71176: pytest <9.0.3 uses predictable /tmp/pytest-of-{user}
    # directory names, allowing local DoS or possible privilege escalation.
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "ruff>=0.4.0",
    "pre-commit>=3.5.0",
    # CVE-2022-40898: wheel <0.38.1 has a ReDoS in the wheel CLI
    "wheel>=0.38.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    # 11.0.1 addresses PYSEC-2026-2999, 3609, 3654 (transitive via
    # mkdocs-material).
    "pymdown-extensions>=11.0.1",
]

[project.scripts]
agent-queue = "src.main:main"
agent-queue-mcp = "packages.mcp_server.mcp_server:main"
aq = "src.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages"]
addopts = "-n auto --dist loadfile --durations=10 -m \"not perf and not migration and not slow and not tmux and not integration\""
markers = [
    "functional: tests that launch real Claude CLI (require auth + API key)",
    "functional_mcp: functional tests requiring npm/npx for MCP servers",
    "integration: tests requiring external dependencies (Milvus Lite, etc.)",
    "tmux: tests requiring a real tmux binary (POSIX only)",
    "perf: latency-budget tests, skipped unless AQ_PERF_STRICT=1 (xdist load makes them flaky)",
    "migration: tests that exercise the real Alembic revision chain",
    "slow: high-cost regression tests kept out of the default developer suite",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# The `from aq_memory.service import ...` must follow the
# `pytest.importorskip("aq_memory")` guard above it, or collection fails
# outright on an install without the optional memory plugin.
"tests/test_facts_bidirectional_sync.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
