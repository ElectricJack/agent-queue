# Smart test selection: the reviewed areas (spec §4.1).
#
# One entry per area; ids are kebab-case, <= 40 characters, and become Jev
# question routing keys.  `description` is what Jev reads: one sentence naming
# the behaviours the area's tests check (concepts, not files).  `match` globs
# are anchored posix paths ("*" stays within one segment, "**" crosses them).
#
# Every runnable test module under pytest's testpaths must match at least one
# area, and every area at least one module.  After adding, moving or deleting
# a test module run `python scripts/generate-selection-catalogue.py` and commit
# tests/selection_catalogue.json.
version: 1
