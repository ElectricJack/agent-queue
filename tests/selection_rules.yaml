# Smart test selection: the reviewed mandatory rules (spec §4.1, §4.2).
#
# A change to a path is mapped, in this order, by: a global invalidator (the
# whole universe runs), a catalogued test module (it runs), a scoped conftest
# (its subtree runs), a non_behavioral glob (nothing more for that path), an
# ownership rule (every module of the named areas runs), a source-scanning
# trigger (the named modules run), or a direct import of a src/ file by a test
# module.  A path none of these map forces the whole universe.
#
# tests/test_selection_catalogue.py checks that every tracked file is mapped,
# that no non_behavioral glob shadows an owning rule, that every rule matches
# some tracked file and that every module and area named here exists.  Globs
# are anchored posix paths: "*" stays within one segment, "**" crosses them.
version: 1

global_invalidators:            # any change -> M = U (spec §4.2)
  - "pyproject.toml"
  - ".test_durations"
  - "scripts/merge_test_durations.py"
  - "alembic.ini"
  - "tests/__init__.py"
  - "tests/conftest.py"
  - "tests/pg_dsn.py"
  - "tests/db_fixtures.py"
  - "tests/alembic_revisions.py"
  - "migrations/**"
  - "src/__init__.py"
  - "src/database/__init__.py"
  - "src/database/base.py"
  - "src/database/engine.py"
  - "src/database/tables.py"
  - "src/database/adapters/**"
  - "src/models.py"
  - "src/config.py"
  - "src/commands/handler.py"

scoped_conftests:
  - { path: "tests/perf/conftest.py", subtree: "tests/perf" }

non_behavioral:                 # never forces fallback, adds nothing; no test reads these
  - "LICENSE"
  - ".gitignore"
  - ".ignore"
  - ".mcp.json"
  - ".pre-commit-config.yaml"
  - ".vibecop.yml"
  - ".claude/**"
  - "docker-compose.yml"
  - "goals.md"
  - "notes.md"
  - "profile.md"
  - "requirements.md"
  - "test-coverage-impl-platform.md"
  - "run_tests.sh"
  - "test_suite.bat"
  - "uninstall.sh"
  - "notes/**"
  - "reports/**"
  - ".superpowers/**"
  - "vault/**"
  - ".github/agent-queue-integration.example.json"
  - "scripts/dashboard-perf/README.md"
  - "scripts/dashboard-perf/*.mjs"
  - "scripts/acceptance/**"
  - "scripts/check-outdated-deps.py"
  - "scripts/inflate_llm_logs.py"
  - "scripts/setup-cgroup-delegation.sh"

ownership:                      # path globs -> areas whose modules join M
  - { paths: ["scripts/bazel/generate_targets.py", "src/**/BUILD.bazel", "tests/BUILD.bazel", "checks/BUILD.bazel"], areas: ["bazel-toolchains", "bazel-environment", "test-selection"] }
  - { paths: ["tools/bazel/runtime.py", "tools/bazel/pytest_plugin.py", "tools/bazel/runtime-contract.md", "tools/bazel/runtime-ledger.json"], areas: ["bazel-runtime"] }
  - { paths: [".bazelversion", ".bazelrc", "MODULE.bazel", "MODULE.bazel.lock", "BUILD.bazel", "tools/bazel/**"], areas: ["bazel-toolchains", "bazel-environment"] }

  - { paths: ["REPO.bazel", "checks/BUILD.bazel", "dashboard/BUILD.bazel", "dashboard/package.json", "packages/aq-ts-client/**", "package.json", "package-lock.json"], areas: ["bazel-toolchains"] }
