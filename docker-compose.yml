name: agent-queue2

services:
  postgres:
    container_name: aq-postgres
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - effective_cache_size=2GB
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: agent_queue
      POSTGRES_USER: agent_queue
      POSTGRES_PASSWORD: agent_queue_dev
    ports:
      - "5533:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_queue"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
