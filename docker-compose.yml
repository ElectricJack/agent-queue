name: agent-queue2

services:
  postgres:
    container_name: aq-postgres
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - effective_cache_size=2GB
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: agent_queue
      POSTGRES_USER: agent_queue
      POSTGRES_PASSWORD: agent_queue_dev
    ports:
      - "5533:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_queue"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Disposable test cluster. Never point the daemon at this service: it trades
  # crash durability for speed and keeps test checkpoints off aq-postgres.
  postgres-test:
    container_name: aq-postgres-test
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: agent_queue_test
      POSTGRES_PASSWORD: agent_queue_test_dev
    ports:
      - "127.0.0.1:5534:5432"
    volumes:
      - pgtestdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_queue_test -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pgtestdata:
