name: Train candidate gate

# `main` accepts only commits carrying the `aq-train/candidate` status (repo
# ruleset "Train-only main"). This workflow posts it on an integration-train
# candidate (`aq/integration/**`, or a git-first batch under `aq/batches/**`)
# once the Tests workflow passed on that exact SHA; the train then
# fast-forwards `main` to it. Pull request commits never get this status, so
# the GitHub merge button cannot land a PR on `main` behind the train's back.
on:
  workflow_run:
    workflows: [Tests]
    types: [requested, in_progress, completed]
    branches:
      - 'aq/integration/**'
      - 'aq/batches/**'

permissions:
  statuses: write
  contents: read
  checks: read

jobs:
  invalidate:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Fence earlier candidate success during reruns or failure
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          STATE: ${{ github.event.action == 'completed' && github.event.workflow_run.conclusion != 'success' && 'failure' || 'pending' }}
        run: |
          gh api "repos/$REPOSITORY/statuses/$SHA" \
            -f state="$STATE" -f context=aq-train/candidate \
            -f description="Awaiting complete exact-candidate verification"
  mark:
    needs: invalidate
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.action == 'completed' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Execute the verifier from the trusted workflow revision. Candidate data
      # is checked out separately and never executed with the status-write token.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: |
            src/integration/suite_cutover.py
            .github/agent-queue-suite-cutover.json
            .github/agent-queue-integration.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          sparse-checkout: |
            .github/agent-queue-suite-cutover.json
            .github/agent-queue-integration.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify the complete candidate check/version policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate --slurp "repos/$REPOSITORY/commits/$SHA/check-runs?filter=all&per_page=100" > "$RUNNER_TEMP/check-runs.json"
          version=$(python3 trusted/src/integration/suite_cutover.py candidate \
            --catalog candidate/.github/agent-queue-suite-cutover.json \
            --trust candidate/.github/agent-queue-integration.json \
            --trusted-catalog trusted/.github/agent-queue-suite-cutover.json \
            --trusted-trust trusted/.github/agent-queue-integration.json \
            --sha "$SHA" --runs "$RUNNER_TEMP/check-runs.json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Mark the tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CHECK_VERSION: ${{ steps.policy.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$REPOSITORY/statuses/$SHA" \
            -f state=success \
            -f context=aq-train/candidate \
            -f description="Exact candidate checks passed ($CHECK_VERSION)"
      - name: Refuse the candidate after a verification error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$REPOSITORY/statuses/$SHA" \
            -f state=failure -f context=aq-train/candidate \
            -f description="Exact candidate verification failed"
