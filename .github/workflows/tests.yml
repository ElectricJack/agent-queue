name: Tests

on:
  push:
  pull_request:

# Keep main's in-progress runs visible; newer PR pushes may still supersede
# their own stale checks.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  integration-attestation:
    name: Integration attestation decision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      skip_full_ci: ${{ steps.decision.outputs.skip_full_ci }}
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Read exact-name check runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          records = []
          try:
              name = urllib.parse.quote("Agent Queue Integration Attestation", safe="")
              url = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                     f"/commits/{os.environ['GITHUB_SHA']}/check-runs"
                     f"?check_name={name}&filter=all&per_page=100")
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              for _ in range(10):
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read(2 * 1024 * 1024 + 1)
                      if len(body) > 2 * 1024 * 1024:
                          raise ValueError("response too large")
                      value = json.loads(body)
                      records.extend(value.get("check_runs", []))
                      link = response.headers.get("Link", "")
                  match = re.search(r'<([^>]+)>;\s*rel="next"', link)
                  if match is None:
                      break
                  url = match.group(1)
              else:
                  raise ValueError("too many response pages")
          except Exception:
              records = []
          with open("attestation-records.json", "w", encoding="utf-8") as output:
              json.dump(records, output)
          PY

      - name: Use empty records outside main
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: echo '[]' > attestation-records.json

      - name: Decide without daemon credentials
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          CHECKOUT_SHA: ${{ github.sha }}
          ATTESTATION_APP_ID: ${{ vars.AQ_INTEGRATION_ATTESTATION_APP_ID }}
          REQUIRED_CHECK_VERSION: ${{ vars.AQ_INTEGRATION_REQUIRED_CHECK_VERSION }}
        run: |
          value=$(python scripts/check-integration-attestation.py \
            --event-name "$EVENT_NAME" --ref "$EVENT_REF" \
            --repository-id "$REPOSITORY_ID" --checkout-sha "$CHECKOUT_SHA" \
            --integration-app-id "${ATTESTATION_APP_ID:-0}" \
            --required-check-version "${REQUIRED_CHECK_VERSION:-unconfigured}" \
            --trust-file .github/agent-queue-integration.json \
            --records-file attestation-records.json)
          echo "skip_full_ci=$value" >> "$GITHUB_OUTPUT"

  test:
    name: Tests (${{ matrix.suite.name }})
    needs: integration-attestation
    if: >-
      always() &&
      ((github.event_name == 'push' &&
        startsWith(github.ref, 'refs/heads/aq/integration/')) ||
       (needs.integration-attestation.outputs.skip_full_ci != 'true' &&
        !(github.event_name == 'pull_request' &&
          startsWith(github.event.pull_request.head.ref, 'aq/integration/'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: default
            command: pytest tests/ -n auto --dist loadfile
          - name: migration-and-slow
            command: pytest tests/ -n auto --dist loadfile -m "migration or slow"
          - name: postgres-integration
            command: pytest tests/ -n auto --dist loadfile -m "integration or perf"

    # Postgres backend for the perf/claim-query suite's Postgres parametrisation
    # (tests/perf/conftest.py's ``any_db``, tests/test_claim_queries.py's ``db``) —
    # spec §15.2 asserts the statement/latency budgets on Postgres, not just SQLite.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agent_queue
          POSTGRES_PASSWORD: agent_queue
          POSTGRES_DB: agent_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Base DSN -- ``tests/pg_dsn.py`` rewrites this per xdist worker
      # process (``postgresql+asyncpg://.../agent_queue_gw0``, ``..._gw1``,
      # ...), creating each worker's database on first use. With
      # ``-n auto`` and three suites (tests/perf, tests/test_claim_queries.py,
      # tests/test_database_postgresql.py) each truncating/reseting a
      # Postgres database against this DSN, sharing one database across
      # concurrent workers would let one worker's reset_for_tests() truncate
      # race another's in-flight seed/assert -- see tests/pg_dsn.py.
      POSTGRES_TEST_DSN: postgresql+asyncpg://agent_queue:agent_queue@localhost:5432/agent_queue
      # Proof that the PostgreSQL contract arms actually run in CI: with this
      # set, tests/pg_dsn.py raises at collection if the DSN ever goes
      # missing, instead of letting every Postgres arm silently skip.
      AQ_REQUIRE_POSTGRES_TESTS: "1"
      # Git-integration tests create real commits and merges; hosted runners
      # ship with no git identity ("Author identity unknown" otherwise).
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@example.invalid

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install -e ".[dev,cli,postgresql]"

      - name: Apply migrations to a scratch SQLite database
        env:
          # Keep the migration check off the developer default
          # (~/.agent-queue/agent-queue.db) and out of pytest's collection path.
          AGENT_QUEUE_DB_URL: sqlite+aiosqlite:///${{ runner.temp }}/ci-migration-check.db
        run: alembic upgrade head

      # SQLite is not a proxy for the production backend: it stores booleans
      # as integers and accepts DDL Postgres rejects outright (revision
      # 33bdb059ceff shipped ``BOOLEAN DEFAULT 0``, which upgraded cleanly on
      # SQLite and failed every Postgres run with DatatypeMismatchError).
      # Run the same chain against a real Postgres so that class of break
      # fails here, in seconds, instead of in every Postgres test fixture.
      - name: Apply migrations to a scratch PostgreSQL database
        env:
          PGPASSWORD: agent_queue
          AGENT_QUEUE_DB_URL: postgresql+asyncpg://agent_queue:agent_queue@localhost:5432/ci_migration_check
        run: |
          psql -h localhost -U agent_queue -d agent_queue \
            -c 'DROP DATABASE IF EXISTS ci_migration_check' \
            -c 'CREATE DATABASE ci_migration_check'
          alembic upgrade head

      - name: Run tests
        run: ${{ matrix.suite.command }}
