name: Tests

on:
  push:
  pull_request:

# One run per ref; a new push supersedes an in-flight run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install -e ".[dev,cli]"

      - name: Apply migrations to a scratch database
        env:
          # Keep the migration check off the developer default
          # (~/.agent-queue/agent-queue.db) and out of pytest's collection path.
          AGENT_QUEUE_DB_URL: sqlite+aiosqlite:///${{ runner.temp }}/ci-migration-check.db
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -n auto
