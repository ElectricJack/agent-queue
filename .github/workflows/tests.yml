name: Tests

on:
  push:
    branches:
      - main
      - 'aq/parent/**'
      - 'aq/integration/**'
      # Existing parent origin is frozen; retain coverage during rollout.
      - 'aq/sound-current'
  workflow_dispatch:

# Integration candidates test the assembled feature changes. A main run
# reuses exact candidate evidence when available; otherwise it tests main.
# Two PRs green on their own stale bases can still put a red `main` together
# (#390 + #391, 2026-09-03: one committed a generated file, the other
# changed how it is generated). That run must therefore never be lost.
#
# With a shared group per ref GitHub keeps at most one *pending* run: a
# burst of merges cancels every queued main run but the newest (#381's and
# #391's runs were both cancelled that way, so #391's merge commit was never
# tested on main at all). Keying main's group by commit gives each merge
# commit its own run, so a red main is reported on the commit that caused
# it, within one CI cycle, and needs no bisecting. Integration branches keep
# one group per ref so a newer push supersedes their obsolete checks.
concurrency:
  group: tests-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'head' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  integration-attestation:
    name: Integration candidate CI reuse decision
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      checks: read
    outputs:
      skip_full_ci: ${{ steps.decision.outputs.skip_full_ci }}
      suppress_duplicate_pr: ${{ steps.decision.outputs.suppress_duplicate_pr }}
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Read exact workflow run evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request

          maximum = 2 * 1024 * 1024
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def read(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read(maximum + 1)
                  if len(body) > maximum:
                      raise ValueError("response too large")
                  return json.loads(body), response.headers.get("Link", "")

          evidence = {"current_run": {}, "workflow_runs": []}
          try:
              api = os.environ["GITHUB_API_URL"]
              repository = os.environ["GITHUB_REPOSITORY"]
              sha = os.environ["GITHUB_SHA"]
              current_id = int(os.environ["CURRENT_RUN_ID"])
              current, _ = read(f"{api}/repos/{repository}/actions/runs/{current_id}")
              workflow_id = current["workflow_id"]
              query = urllib.parse.urlencode({
                  "event": "push",
                  "head_sha": sha,
                  "exclude_pull_requests": "true",
                  "per_page": 100,
              })
              url = f"{api}/repos/{repository}/actions/workflows/{workflow_id}/runs?{query}"
              records = []
              for _ in range(10):
                  value, link = read(url)
                  runs = value.get("workflow_runs") if isinstance(value, dict) else None
                  if not isinstance(runs, list):
                      raise ValueError("invalid workflow runs response")
                  for run in runs:
                      branch = run.get("head_branch") if isinstance(run, dict) else None
                      if (
                          not isinstance(branch, str)
                          or re.fullmatch(
                              r"aq/integration/p-[0-9a-f]{32}/r-[0-9a-f]{32}", branch
                          ) is None
                          or run.get("head_sha") != sha
                      ):
                          continue
                      run_id = run["id"]
                      attempt_number = run["run_attempt"]
                      attempt, _ = read(
                          f"{api}/repos/{repository}/actions/runs/{run_id}"
                          f"/attempts/{attempt_number}"
                      )
                      latest, _ = read(f"{api}/repos/{repository}/actions/runs/{run_id}")
                      records.append({"listed": run, "attempt": attempt, "latest": latest})
                  match = re.search(r'<([^>]+)>;\s*rel="next"', link)
                  if match is None:
                      break
                  url = match.group(1)
              else:
                  raise ValueError("too many response pages")
              evidence = {"current_run": current, "workflow_runs": records}
          except Exception:
              evidence = {"current_run": {}, "workflow_runs": []}
          with open("workflow-runs.json", "w", encoding="utf-8") as output:
              json.dump(evidence, output)
          PY

      - name: Use empty evidence outside main
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: echo '{"current_run":{},"workflow_runs":[]}' > workflow-runs.json

      - name: Decide without daemon credentials
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_FULL_NAME: ${{ github.repository }}
          CHECKOUT_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_REPOSITORY_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          value=$(python scripts/check-integration-attestation.py \
            --event-name "$EVENT_NAME" --ref "$EVENT_REF" \
            --default-branch "$DEFAULT_BRANCH" \
            --repository-full-name "$REPOSITORY_FULL_NAME" \
            --checkout-sha "$CHECKOUT_SHA" \
            --current-run-id "$CURRENT_RUN_ID" \
            --current-run-attempt "$CURRENT_RUN_ATTEMPT" \
            --workflow-runs-file workflow-runs.json)
          echo "skip_full_ci=$value" >> "$GITHUB_OUTPUT"
          duplicate=$(python scripts/check-integration-attestation.py \
            --matching-integration-pr --event-name "$EVENT_NAME" \
            --repository-full-name "$REPOSITORY_FULL_NAME" \
            --head-repository-full-name "$HEAD_REPOSITORY_FULL_NAME" \
            --head-ref "$HEAD_REF")
          echo "suppress_duplicate_pr=$duplicate" >> "$GITHUB_OUTPUT"

  test:
    name: Tests (${{ matrix.suite.name }})
    needs: integration-attestation
    if: >-
      always() &&
      ((github.event_name == 'push' &&
        startsWith(github.ref, 'refs/heads/aq/integration/')) ||
       (needs.integration-attestation.outputs.skip_full_ci != 'true' &&
        needs.integration-attestation.outputs.suppress_duplicate_pr != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: default
            command: pytest tests/ -n auto --dist loadfile
          - name: migration-and-slow
            command: pytest tests/ -n auto --dist loadfile -m "migration or slow"
          - name: postgres-integration
            command: pytest tests/ -n auto --dist loadfile -m "integration or perf"

    # Postgres backend for the perf/claim-query suite's Postgres parametrisation
    # (tests/perf/conftest.py's ``any_db``, tests/test_claim_queries.py's ``db``) —
    # spec §15.2 asserts the statement/latency budgets on Postgres, not just SQLite.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agent_queue
          POSTGRES_PASSWORD: agent_queue
          POSTGRES_DB: agent_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Base DSN -- ``tests/pg_dsn.py`` rewrites this per xdist worker
      # process (``postgresql+asyncpg://.../agent_queue_gw0``, ``..._gw1``,
      # ...), creating each worker's database on first use. With
      # ``-n auto`` and three suites (tests/perf, tests/test_claim_queries.py,
      # tests/test_database_postgresql.py) each truncating/reseting a
      # Postgres database against this DSN, sharing one database across
      # concurrent workers would let one worker's reset_for_tests() truncate
      # race another's in-flight seed/assert -- see tests/pg_dsn.py.
      POSTGRES_TEST_DSN: postgresql+asyncpg://agent_queue:agent_queue@localhost:5432/agent_queue
      # Compatibility guard for helpers imported outside normal pytest startup.
      # The root conftest now requires POSTGRES_TEST_DSN for every run and fails
      # once at session setup if it is missing.
      AQ_REQUIRE_POSTGRES_TESTS: "1"
      # Git-integration tests create real commits and merges; hosted runners
      # ship with no git identity ("Author identity unknown" otherwise).
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@example.invalid

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install -e ".[dev,cli]"

      # The SQLite half of this check is gone with the backend.  It was never
      # a proxy for production anyway: it stored booleans as integers and
      # accepted DDL Postgres rejects outright (revision 33bdb059ceff shipped
      # ``BOOLEAN DEFAULT 0``, which upgraded cleanly on SQLite and failed
      # every Postgres run with DatatypeMismatchError).
      - name: Apply migrations to a scratch PostgreSQL database
        env:
          PGPASSWORD: agent_queue
          AGENT_QUEUE_DB_URL: postgresql+asyncpg://agent_queue:agent_queue@localhost:5432/ci_migration_check
        run: |
          psql -h localhost -U agent_queue -d agent_queue \
            -c 'DROP DATABASE IF EXISTS ci_migration_check' \
            -c 'CREATE DATABASE ci_migration_check'
          alembic upgrade head

      - name: Run tests
        run: ${{ matrix.suite.command }}
