name: Tests

# The full suite runs before a change reaches `main`, never after:
#
# * `pull_request` into `main` tests the PR's merge with its base.
# * A push to `aq/integration/**` tests the train's assembled candidate, and
#   the train promotes that exact tested SHA to `main`.
# * A push to `aq/parent/**` tests an immutable parent snapshot ref that
#   `src/integration/parent_ci.py` publishes and then reads the run from.
#
# `main` itself is not a trigger. Everything that reaches it was validated
# first, by one of the runs above or by the development publisher's
# pre-publish validation, so a run per `main` commit only repeated that work.
# `workflow_dispatch` runs the suite by hand on any branch, `main` included.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - 'aq/parent/**'
      - 'aq/integration/**'
  workflow_dispatch:

# One group per ref (`refs/pull/<n>/merge` for a PR), so a newer push
# supersedes that PR's or integration branch's obsolete run. Parent snapshot
# refs are named by SHA and never share a group.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.suite.name }})
    # A draft PR waits for `ready_for_review`. A same-repository PR from an
    # `aq/integration/**` branch is skipped because the push trigger above
    # already tests that head SHA, and its checks appear on the PR.
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
       !(github.event.pull_request.head.repo.full_name == github.repository &&
         startsWith(github.event.pull_request.head.ref, 'aq/integration/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: cli-conformance
            command: aq test tests/test_cli_inventory.py tests/test_cli_conformance.py
          # Each shard selects a disjoint, timing-balanced subset before xdist
          # distributes its files across four workers. Refresh .test_durations
          # with the command documented in docs/contributing/ci.md.
          - name: default-1/8
            command: pytest tests/ -n 4 --dist loadfile --splits 8 --group 1 --splitting-algorithm least_duration
          - name: default-2/8
            command: pytest tests/ -n 4 --dist loadfile --splits 8 --group 2 --splitting-algorithm least_duration
          - name: default-3/8
            command: pytest tests/ -n 4 --dist loadfile --splits 8 --group 3 --splitting-algorithm least_duration
          - name: default-4/8
            command: pytest tests/ -n 4 --dist loadfile --splits 8 --group 4 --splitting-algorithm least_duration
          - name: default-5/8
            command: pytest tests/ -n 4 --dist loadfile --splits 8 --group 5 --splitting-algorithm least_duration
          - name: default-6/8
            command: pytest tests/ -n 4 --dist loadfile --splits 8 --group 6 --splitting-algorithm least_duration
          - name: default-7/8
            command: pytest tests/ -n 4 --dist loadfile --splits 8 --group 7 --splitting-algorithm least_duration
          - name: default-8/8
            command: pytest tests/ -n 4 --dist loadfile --splits 8 --group 8 --splitting-algorithm least_duration
          - name: migration-and-slow
            command: pytest tests/ -n auto --dist loadfile -m "migration or slow"
          - name: postgres-integration
            command: pytest tests/ -n auto --dist loadfile -m "integration or perf"

    # Postgres backend for the perf/claim-query suite's Postgres parametrisation
    # (tests/perf/conftest.py's ``any_db``, tests/test_claim_queries.py's ``db``) —
    # spec §15.2 asserts the statement/latency budgets on Postgres, not just SQLite.
    services:
      postgres:
        image: postgres:18
        # Four xdist workers each lease multiple databases and can briefly
        # exceed PostgreSQL's default 100 connections during the full suite.
        command: postgres -c max_connections=300
        env:
          POSTGRES_USER: agent_queue
          POSTGRES_PASSWORD: agent_queue
          POSTGRES_DB: agent_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Base DSN -- ``tests/pg_dsn.py`` rewrites this per xdist worker
      # process (``postgresql+asyncpg://.../agent_queue_gw0``, ``..._gw1``,
      # ...), creating each worker's database on first use. With
      # ``-n auto`` and three suites (tests/perf, tests/test_claim_queries.py,
      # tests/test_database_postgresql.py) each truncating/reseting a
      # Postgres database against this DSN, sharing one database across
      # concurrent workers would let one worker's reset_for_tests() truncate
      # race another's in-flight seed/assert -- see tests/pg_dsn.py.
      POSTGRES_TEST_DSN: postgresql+asyncpg://agent_queue:agent_queue@localhost:5432/agent_queue
      # Compatibility guard for helpers imported outside normal pytest startup.
      # The root conftest now requires POSTGRES_TEST_DSN for every run and fails
      # once at session setup if it is missing.
      AQ_REQUIRE_POSTGRES_TESTS: "1"
      # Git-integration tests create real commits and merges; hosted runners
      # ship with no git identity ("Author identity unknown" otherwise).
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@example.invalid

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install -e ".[dev,cli]"

      # The SQLite half of this check is gone with the backend.  It was never
      # a proxy for production anyway: it stored booleans as integers and
      # accepted DDL Postgres rejects outright (revision 33bdb059ceff shipped
      # ``BOOLEAN DEFAULT 0``, which upgraded cleanly on SQLite and failed
      # every Postgres run with DatatypeMismatchError).
      - name: Apply migrations to a scratch PostgreSQL database
        env:
          PGPASSWORD: agent_queue
          AGENT_QUEUE_DB_URL: postgresql+asyncpg://agent_queue:agent_queue@localhost:5432/ci_migration_check
        run: |
          psql -h localhost -U agent_queue -d agent_queue \
            -c 'DROP DATABASE IF EXISTS ci_migration_check' \
            -c 'CREATE DATABASE ci_migration_check'
          alembic upgrade head

      - name: Run tests
        # Include fixture setup/teardown in the per-test deadline. Keep the
        # failed/error node IDs and the slowest phases visible in every arm.
        run: ${{ matrix.suite.command }} --timeout=120 --durations=50 -rfE
